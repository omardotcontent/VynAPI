    // NOTE: ForgeGradle 7 (the official line for 1.21.11) requires Gradle 9.3+, which the
    // other loaders here (Loom 1.13, ModDevGradle 2.0) are not pinned for yet.
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
}
