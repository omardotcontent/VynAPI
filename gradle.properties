# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=26.1-1.0.0
group=studio.meraki
java_version=25

# Common
minecraft_version=26.1
mod_name=VynAPI
mod_author=OmarDotContent & Abdelaziz_Mohamed
mod_id=vynapi
license=All-Rights-Reserved
credits=Vyn Port by Abdelaziz_Mohamed, Mod Port by OmarDotContent
description=The Vyn language API for Minecraft
# 26.1 is the start of 26.x (calver). Cap the range at the next calver release (26.2).
minecraft_version_range=[26.1, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1-1

# Fabric, see https://fabricmc.net/develop/ for new versions
# Fabric API 0.145.2+26.1 is the latest release for 26.1
fabric_version=0.145.1+26.1
fabric_loader_version=0.19.3

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/index_26.1.html for new versions
forge_version=62.0.9
forge_loader_version_range=[62,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.94
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# NOTE: IntelliJ must run Gradle on a JDK 25 (File > Settings > Build, Execution,
# Deployment > Build Tools > Gradle > Gradle JVM), matching java_version above.
# Running Gradle 8.14 on an incompatible JDK can break the Forge
# toolchain during sync ("project services has been closed" in the forge module).
# If the forge module shows that error, run ".\gradlew --stop", then
# ".\gradlew :forge:setupWorkspace" once from a terminal, then re-sync IntelliJ.