# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.21.11-1.0.0
group=studio.meraki
java_version=21

# Common
minecraft_version=1.21.11
mod_name=VynAPI
mod_author=OmarDotContent & Abdelaziz_Mohamed
mod_id=vynapi
license=All-Rights-Reserved
credits=Vyn Port by Abdelaziz_Mohamed, Mod Port by OmarDotContent
description=The Vyn scripting language, embedded in Minecraft.
# 1.21.11 is the last 1.x Minecraft release; next is 26.1 (calver). Cap the range at the start of 26.x.
minecraft_version_range=[1.21.11, 26.1)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.11
# TODO: confirm the exact Parchment release version for 1.21.11 on parchmentmc.org; using 2025.12.09 as a placeholder
parchment_version=2025.12.20

# Fabric, see https://fabricmc.net/develop/ for new versions
# Fabric API 0.141.6 is the latest release for 1.21.11
fabric_version=0.141.6+1.21.11
fabric_loader_version=0.17.3

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.11.html for new versions
forge_version=61.1.0
forge_loader_version_range=[61,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.11.45
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# NOTE: IntelliJ must run Gradle on a JDK 21 (File > Settings > Build, Execution,
# Deployment > Build Tools > Gradle > Gradle JVM), matching java_version above.
# Running Gradle 8.14 on a newer JDK (24/25) is unsupported and can break the Forge
# toolchain during sync ("project services has been closed" in the forge module).
# If the forge module shows that error, run ".\gradlew --stop", then
# ".\gradlew :forge:setupWorkspace" once from a terminal, then re-sync IntelliJ.
