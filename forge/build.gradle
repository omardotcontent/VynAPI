plugins {
    id 'multiloader-loader'
    // Pinned, see the root build.gradle for why (the '[6.0.24,6.2)' range could resolve
    // to a stale cached ForgeGradle, missing the Gradle 8.14.x / modern-MC fixes).
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    // Needed by ForgeGradle's copyIdeResources + IntelliJ run configs, and it registers
    // the 'ideaSyncTask' hook below that pre-warms the Forge toolchain during IDE sync.
    id 'idea'
}

mixin {
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

// Enable Forge's Jar-in-Jar so Vyn-Script is bundled into the production jar
jarJar.enable()

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    // Automatically enable forge AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Vyn Script engine - minecraftLibrary adds it to the compile + dev runtime classpath,
    // and jarJar bundles it into the production jar (fixes NoClassDefFoundError: NativeFunction).
    // Declared here as well because common is compileOnly + source copied.
    minecraftLibrary "me.abdelaziz:Vyn-Script:1.0-SNAPSHOT"
    jarJar(group: "me.abdelaziz", name: "Vyn-Script", version: "1.0-SNAPSHOT")

    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// One-time terminal setup:  ./gradlew :forge:setupWorkspace
// Generates and caches all Forge/MCP toolchain artifacts outside of the IDE sync.
// Run this once after a fresh clone (or after deleting the ForgeGradle cache), then
// sync IntelliJ - the sync will read the cached artifacts instead of re-running the
// fragile lazy pipeline.
tasks.register('setupWorkspace') {
    group = 'forge'
    description = 'Pre-generates the Forge/MCP toolchain artifacts so IDE sync does not have to (run once per fresh checkout).'
    doLast {
        configurations.minecraft.resolve()
    }
}
